# Atualiza e publica o site no GitHub Pages.
# - Todo dia às 06h (Brasília): verifica o Drive e o site da Cury, extrai textos (com OCR para escaneados)
# - A cada publicação feita pelo painel (push) e também manualmente (aba Actions → Run workflow)
name: Atualizar e publicar o site

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o código (sempre a versão mais recente, mesmo se a execução ficou na fila)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar leitores de PDF e OCR (Tesseract em português)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por > /dev/null

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, intl, mbstring, curl, zip, dom
          coverage: none

      - name: Criar configuração (a chave do Google vem dos Secrets do repositório)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          php -r '
            $c = require "app/config.example.php";
            $c["google_api_key"] = getenv("GOOGLE_API_KEY") ?: "";
            $c["admin_password_hash"] = "";
            $c["sync_token"] = "";
            file_put_contents("app/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");
          '

      - name: Sincronizar e gerar o site
        run: php tools/build.php --sync

      - name: Guardar o estado atualizado (documentos novos, andamento da obra)
        run: |
          git config user.name "robo-do-site"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "Nada mudou no Drive nem na obra."
          else
            git commit -m "Atualização automática: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            # state/ só é escrito pelo robô: em caso de conflito, vale a versão desta execução (a mais nova)
            git pull --rebase --autostash -X theirs
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
